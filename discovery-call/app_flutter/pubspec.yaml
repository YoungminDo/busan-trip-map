# ⚠️ 스캐폴드 — 이 환경(Linux 컨테이너)에서는 빌드/실행 검증 불가.
# Week 1–2 실기기 스파이크에서 CallKit E2E와 함께 검증한다 (docs/기술검토.md).
name: discovery_call_app
description: 나를 발견하는 통화 — iOS MVP
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_callkit_incoming: ^2.5.0   # CallKit 수신 UI + PushKit 연동 (iOS 네이티브 AppDelegate 작업 필요)
  livekit_client: ^2.3.0             # WebRTC 오디오
  firebase_messaging: ^15.0.0        # 일반 푸시 (일기 도착 알림)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
